# Git hooks managed by lefthook (https://lefthook.dev)
# Runs Prettier on staged files before each commit.

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,md,yml,yaml}'
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
