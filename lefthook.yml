# Git hooks managed by lefthook (https://lefthook.dev)

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,json,jsonc}'
      run: bunx biome check --write --no-errors-on-unmatched --staged {staged_files}
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck
    - name: changelog
      run: bash scripts/check-changelog.sh --staged develop
