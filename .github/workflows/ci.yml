name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:boundaries
      - run: bun run build
      - run: bun run typecheck
      - run: bun run --filter '@ekozhq/admin' build
      - run: bun run --filter '@ekozhq/client-web' build
      - run: bun run openapi:check
      - run: bun run check
      - run: bun run test
      - run: bun run test:server

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changelog entry when a workspace src/ changes
        run: bash scripts/check-changelog.sh "origin/${{ github.base_ref }}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: ekoz-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
