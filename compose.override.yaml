# Auto-merged by `docker compose` on top of compose.yaml. Remaps the published
# host ports to avoid clashes with other local Postgres / SMTP instances.
# `!override` replaces the base `ports` list instead of appending to it.
# Container-internal ports are unchanged.
services:
  postgres:
    ports: !override
      - '5410:5432'

  mailpit:
    ports: !override
      - '1010:1025' # SMTP
      - '8010:8025' # web UI
